<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Guvi Internship</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">User Registration</h2>

                        <div class="alert alert-info" role="alert" id="infoMessage" style="display:none;"></div>
                        <div class="alert alert-danger" role="alert" id="errorMessage" style="display:none;"></div>
                        <div class="alert alert-success" role="alert" id="successMessage" style="display:none;"></div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                            <small class="form-text text-muted">We'll never share your email.</small>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-control"
                                placeholder="Enter a strong password" required>
                            <small class="form-text text-muted">Minimum 6 characters recommended.</small>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" class="form-control"
                                placeholder="Confirm your password" required>
                        </div>

                        <button id="registerBtn" class="btn btn-primary btn-block btn-lg"
                            type="button">Register</button>

                        <hr class="my-4">

                        <p class="text-center">Already have an account? <a href="login.html"
                                class="font-weight-bold">Login here</a></p>
                        <p class="text-center"><a href="index.html">Back to Home</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
