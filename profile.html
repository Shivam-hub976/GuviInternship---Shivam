<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Guvi Internship</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Guvi Internship</span>
            <button id="logoutBtn" class="btn btn-danger ml-auto">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">
                            <i class="fas fa-user-circle"></i> My Profile
                        </h2>

                        <div class="alert alert-danger" role="alert" id="errorMessage" style="display:none;"></div>
                        <div class="alert alert-success" role="alert" id="successMessage" style="display:none;"></div>
                        <div class="alert alert-info" role="alert" id="infoMessage" style="display:none;"></div>

                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" class="form-control" min="1" max="150"
                                placeholder="Enter your age">
                        </div>

                        <div class="form-group">
                            <label for="dob">Date of Birth</label>
                            <input type="date" id="dob" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="contact">Contact Number</label>
                            <input type="tel" id="contact" class="form-control" placeholder="Enter your contact number">
                        </div>

                        <div class="form-group">
                            <button id="updateBtn" class="btn btn-warning btn-block btn-lg">
                                <i class="fas fa-save"></i> Update Profile
                            </button>
                        </div>

                        <hr class="my-4">

                        <div class="row">
                            <div class="col-md-6">
                                <button id="logoutBtnSecondary" class="btn btn-danger btn-block">
                                    <i class="fas fa-sign-out-alt"></i> Logout
                                </button>
                            </div>
                            <div class="col-md-6">
                                <a href="index.html" class="btn btn-secondary btn-block">
                                    <i class="fas fa-home"></i> Home
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
